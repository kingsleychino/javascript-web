# ------------------------------------------------------------------
# Cache policy chosen by response type.
# Using a map keeps every add_header at server level, because any
# add_header inside a location block would wipe out the security
# headers below for that location.
# ------------------------------------------------------------------
map $sent_http_content_type $cache_control {
    default                     "no-cache";                       # HTML, CSS, JS: revalidate via ETag (cheap 304s)
    ~image/                     "public, max-age=2592000";        # 30 days
    ~font/                      "public, max-age=31536000, immutable";
}

server {
    # IPv4 only: adding "listen [::]:8080" crashes Nginx on hosts with IPv6 disabled
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    etag on;

    # ---------- Compression ----------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- Headers (inherited by every location) ----------
    add_header Cache-Control           $cache_control always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Content Security Policy, matched to what index.html actually loads:
    #   cdnjs.cloudflare.com   Font Awesome 7 CSS + webfonts
    #   fonts.googleapis.com   Google Fonts CSS (Inter, Plus Jakarta Sans)
    #   fonts.gstatic.com      Google Fonts files
    #   cdn.jsdelivr.net       Swiper 8 JS/CSS, dotLottie WASM engine
    #   unpkg.com              dotlottie-wc module (+ WASM fallback)
    #   lottie.host            the three .lottie animations
    #   images.unsplash.com    hero background image
    # 'wasm-unsafe-eval' lets dotLottie compile its WebAssembly renderer.
    # 'unsafe-inline' in style-src is needed for inline style="" attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self' https://lottie.host https://cdn.jsdelivr.net https://unpkg.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ---------- Health check ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No favicon in the project yet: answer quietly instead of logging 404s
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Block hidden files (.git, .env, …)
    location ~ /\. {
        access_log off;
        log_not_found off;
        return 404;
    }

    # ---------- Static files ----------
    # Single-page site with #anchor navigation, so unknown paths are real 404s
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}