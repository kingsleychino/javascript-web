name: CI/CD with Terraform

on:
  push:
    branches:
      - Compile-CID/CD-with-Terraform-AWS
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Folder containing your .tf files ("." = repo root, or e.g. "terraform")
  TF_WORKING_DIR: .

jobs:
  deploy-infra:
    name: Terraform plan & apply
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    env:
      TF_VAR_aws_region: us-east-1
      TF_VAR_key_name: deployer-key
      TF_VAR_public_key: ${{ secrets.AWS_SSH_KEY_PUBLIC }}
      TF_VAR_private_key: ${{ secrets.AWS_SSH_KEY_PRIVATE }}
      TF_STATE_BUCKET_NAME: ${{ secrets.AWS_TF_STATE_BUCKET_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=0
          for name in TF_STATE_BUCKET_NAME TF_VAR_public_key TF_VAR_private_key; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for $name is empty or not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Check Terraform files are present
        run: |
          if ! ls ./*.tf >/dev/null 2>&1; then
            echo "::error::No .tf files in '${TF_WORKING_DIR}'. Set TF_WORKING_DIR to one of these folders:"
            find "$GITHUB_WORKSPACE" -name '*.tf' -not -path '*/.terraform/*' -printf '  %h\n' \
              | sed "s#$GITHUB_WORKSPACE/\{0,1\}#./#" | sort -u
            exit 1
          fi
          echo "Found:" ./*.tf

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET_NAME}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform format check
        run: terraform fmt -check -diff
        continue-on-error: true

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      - name: Show outputs
        run: |
          {
            echo "### Terraform outputs"
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          terraform output