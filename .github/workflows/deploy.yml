# ==========================================================================
#  CI/CD with Terraform
#
#  MODE: apply   -> create the server, build the app, run it on the server
#  MODE: destroy -> delete the server and the ECR repository
#
#  To switch, change ONE line below (MODE) and push.
# ==========================================================================

name: CI/CD with Terraform

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  MODE: apply                        # <-- change to: destroy
  AWS_REGION: us-east-1
  ECR_REPOSITORY: javascript-web

jobs:

  # ------------------------------------------------------------------------
  # JOB 1: Terraform (create or destroy the server)
  # ------------------------------------------------------------------------
  infra:
    runs-on: ubuntu-latest
    outputs:
      server_ip: ${{ steps.get-ip.outputs.ip }}
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_aws_region: us-east-1
      TF_VAR_key_name: deployer-key
      TF_VAR_public_key: ${{ secrets.AWS_SSH_KEY_PUBLIC }}
      TF_VAR_private_key: ${{ secrets.AWS_SSH_KEY_PRIVATE }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -backend-config="bucket=${{ secrets.AWS_TF_STATE_BUCKET_NAME }}" -backend-config="region=${{ env.AWS_REGION }}"

      # ---- MODE: apply ----
      - name: Terraform apply
        if: env.MODE == 'apply'
        run: terraform apply -auto-approve

      # - name: Get server IP
      #   if: env.MODE == 'apply'
      #   id: get-ip
      #   run: echo "ip=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"

      # ---- MODE: destroy ----
      - name: Terraform destroy
        if: env.MODE == 'destroy'
        run: terraform destroy -auto-approve

      - name: Delete ECR repository
        if: env.MODE == 'destroy'
        run: aws ecr delete-repository --repository-name "$ECR_REPOSITORY" --force || true

  # ------------------------------------------------------------------------
  # JOB 2: Build and deploy the app (skipped in destroy mode: no server IP)
  # ------------------------------------------------------------------------
  app:
    runs-on: ubuntu-latest
    needs: infra
    if: needs.infra.outputs.server_ip != ''
    env:
      SERVER_IP: ${{ needs.infra.outputs.server_ip }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create ECR repository if missing
        run: aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" || aws ecr create-repository --repository-name "$ECR_REPOSITORY"

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Wait for server to boot
        run: |
          ID=$(aws ec2 describe-instances --filters "Name=ip-address,Values=$SERVER_IP" --query "Reservations[0].Instances[0].InstanceId" --output text)
          aws ec2 wait instance-status-ok --instance-ids "$ID"

      - name: Get ECR password for the server
        id: token
        run: |
          PASSWORD=$(aws ecr get-login-password)
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          PASSWORD: ${{ steps.token.outputs.password }}
        with:
          host: ${{ env.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY_PRIVATE }}
          envs: REGISTRY,IMAGE,PASSWORD
          script: |
            set -e
            if ! command -v docker; then
              sudo cloud-init status --wait || true
              sudo apt-get update -y
              sudo apt-get install -y docker.io
            fi
            echo "$PASSWORD" | sudo docker login --username AWS --password-stdin "$REGISTRY"
            sudo docker pull "$IMAGE"
            sudo docker rm -f myapp || true
            sudo docker run -d --name myapp --restart unless-stopped -p 8080:8080 "$IMAGE"

      - name: Check site is up
        run: |
          sleep 5
          curl -fsS "http://$SERVER_IP:8080/" > /dev/null
          echo "Site is live: http://$SERVER_IP:8080"