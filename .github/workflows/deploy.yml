name: CI/CD with Terraform

on:
  push:
    # Must match the branch name EXACTLY (case-sensitive). Check with: git branch --show-current
    branches:
      - Compile-CID/CD-with-Terraform-AWS
  # Adds a "Run workflow" button in the Actions tab so you can run it by hand
  workflow_dispatch:

# Never run two applies against the same state at once
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Folder that holds your .tf files ("." = repo root). Change if they live in e.g. ./terraform
  TF_WORKING_DIR: .

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    env:
      # Terraform reads TF_VAR_<name> automatically as var.<name>.
      # This is safer than -var="..." on the command line: multi-line SSH keys
      # keep their newlines, and the values never appear in the shell command.
      TF_VAR_private_key: ${{ secrets.AWS_SSH_KEY_PRIVATE }}
      TF_VAR_public_key: ${{ secrets.AWS_SSH_KEY_PUBLIC }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_key_name: deployer-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check required secrets
        env:
          TF_STATE_BUCKET_NAME: ${{ secrets.AWS_TF_STATE_BUCKET_NAME }}
        run: |
          missing=0
          for name in TF_STATE_BUCKET_NAME TF_VAR_private_key TF_VAR_public_key; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is empty or not set"; missing=1; fi
          done
          exit $missing

      - name: Terraform init
        env:
          TF_STATE_BUCKET_NAME: ${{ secrets.AWS_TF_STATE_BUCKET_NAME }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET_NAME}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan -out=tfplan
          echo "Terraform plan created."

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan